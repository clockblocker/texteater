<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <title>textfresser eating a page (animated)</title>
  <desc>Construction: a white page holds black rounded word bars and a small black eye. Six equal black circles, positioned as in the animation sketch, bite the page away around the textfresser, leaving it as the white silhouette with two ears, a small head with the eye, and a body flaring out to the bottom of the page. The bites land in rainbow order (red, orange, yellow, green, blue, purple). Where a bite covers a word, a blue rectangle is layered directly on top of its black original: the eaten words turn blue, floating on the black that replaced the page. Darker blue words are not yet known, lighter blue ones are processed. This version replays the construction: the six bites grow in rainbow order and the eaten words turn blue exactly where they are covered.</desc>
  <!-- the canvas -->
  <rect width="640" height="640" fill="#000000"/>
  <!-- the page -->
  <rect width="640" height="640" fill="#FFFFFF"/>
  <!-- the words, uneaten -->
  <rect x="196.3" y="69" width="98.7" height="29" rx="7" fill="#1E1613"/>
  <rect x="344.4" y="69" width="114.9" height="29" rx="7" fill="#1E1613"/>
  <rect x="55.4" y="149" width="177.7" height="30" rx="7" fill="#1E1613"/>
  <rect x="304.2" y="149" width="54.8" height="30" rx="7" fill="#1E1613"/>
  <rect x="410.1" y="149" width="71.9" height="30" rx="7" fill="#1E1613"/>
  <rect x="580.2" y="149" width="38.7" height="30" rx="7" fill="#1E1613"/>
  <rect x="21.7" y="226" width="114.8" height="30" rx="7" fill="#1E1613"/>
  <rect x="213.6" y="226" width="136.3" height="30" rx="7" fill="#1E1613"/>
  <rect x="18.5" y="299" width="93.9" height="31" rx="7" fill="#1E1613"/>
  <rect x="196.8" y="299" width="105.2" height="31" rx="7" fill="#1E1613"/>
  <rect x="53.5" y="406" width="41.3" height="30" rx="7" fill="#1E1613"/>
  <rect x="215.2" y="406" width="165.2" height="30" rx="7" fill="#1E1613"/>
  <rect x="398.1" y="406" width="144.4" height="30" rx="7" fill="#1E1613"/>
  <rect x="188.4" y="481" width="87.0" height="28" rx="7" fill="#1E1613"/>
  <rect x="314.5" y="481" width="100.4" height="28" rx="7" fill="#1E1613"/>
  <rect x="437.8" y="481" width="47.2" height="28" rx="7" fill="#1E1613"/>
  <!-- the eye -->
  <circle cx="401.1" cy="244.5" r="13.1" fill="#1E1613"/>
  <!-- the bites, in rainbow order: they grow in and eat the page away -->
  <circle cx="129.7" cy="65.1" r="0" fill="#000000"><!-- red bite --><animate attributeName="r" values="0;177.1" begin="0.40s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="649.8" cy="3.4" r="0" fill="#000000"><!-- orange bite --><animate attributeName="r" values="0;178.2" begin="0.95s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="437.8" cy="43.6" r="0" fill="#000000"><!-- yellow bite --><animate attributeName="r" values="0;177.1" begin="1.50s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="672.9" cy="239.0" r="0" fill="#000000"><!-- green bite --><animate attributeName="r" values="0;177.1" begin="2.05s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="203.2" cy="227.7" r="0" fill="#000000"><!-- blue bite --><animate attributeName="r" values="0;177.1" begin="2.60s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="27.1" cy="355.0" r="0" fill="#000000"><!-- purple bite --><animate attributeName="r" values="0;177.1" begin="3.15s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <!-- eaten words: blue copies revealed exactly where the bites cover them -->
  <clipPath id="bites">
    <circle cx="129.7" cy="65.1" r="0"><animate attributeName="r" values="0;177.1" begin="0.40s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="649.8" cy="3.4" r="0"><animate attributeName="r" values="0;178.2" begin="0.95s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="437.8" cy="43.6" r="0"><animate attributeName="r" values="0;177.1" begin="1.50s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="672.9" cy="239.0" r="0"><animate attributeName="r" values="0;177.1" begin="2.05s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="203.2" cy="227.7" r="0"><animate attributeName="r" values="0;177.1" begin="2.60s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="27.1" cy="355.0" r="0"><animate attributeName="r" values="0;177.1" begin="3.15s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  </clipPath>
  <g clip-path="url(#bites)">
  <rect x="196.3" y="69" width="98.7" height="29" rx="7" fill="#0D385B"/>
  <rect x="344.4" y="69" width="114.9" height="29" rx="7" fill="#071E2E"/>
  <rect x="55.4" y="149" width="177.7" height="30" rx="7" fill="#071E2E"/>
  <rect x="304.2" y="149" width="54.8" height="30" rx="7" fill="#0D385B"/>
  <rect x="410.1" y="149" width="71.9" height="30" rx="7" fill="#071E2E"/>
  <rect x="580.2" y="149" width="38.7" height="30" rx="7" fill="#0D385B"/>
  <rect x="21.7" y="226" width="114.8" height="30" rx="7" fill="#0D385B"/>
  <rect x="213.6" y="226" width="136.3" height="30" rx="7" fill="#071E2E"/>
  <rect x="18.5" y="299" width="93.9" height="31" rx="7" fill="#071E2E"/>
  <rect x="196.8" y="299" width="105.2" height="31" rx="7" fill="#0D385B"/>
  <rect x="53.5" y="406" width="41.3" height="30" rx="7" fill="#071E2E"/>
  </g>
</svg>
