<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <title>textfresser eating a page (animated)</title>
  <desc>Construction: a white page holds black rounded word bars and a small black eye. Six equal black circles bite the page away around the textfresser, leaving one clean white silhouette aligned with the reference mascot. Every circle contributes visible final area. The bites land in rainbow order (red, orange, yellow, green, blue, violet): red takes the upper left, orange carves the head dome, yellow closes the upper right, green takes the lower left, blue carves the head's left side, and violet carves its right side. Where a bite covers a word, a blue rectangle is layered directly on top of its black original: the eaten words turn blue, floating on the black that replaced the page. Darker blue words are not yet known, lighter blue ones are processed. This version replays the construction: six full-size bites appear in rainbow order at a slightly irregular rhythm, and the eaten words turn blue with the bite that covers them.</desc>
  <!-- the canvas -->
  <rect width="640" height="640" fill="#000000"/>
  <!-- the page -->
  <rect width="640" height="640" fill="#FFFFFF"/>
  <!-- the words, uneaten -->
  <rect x="178" y="54" width="117" height="31" rx="8" fill="#1E1613"/>
  <rect x="334" y="54" width="121" height="31" rx="8" fill="#1E1613"/>
  <rect x="72" y="150" width="187" height="31" rx="8" fill="#1E1613"/>
  <rect x="299" y="149" width="57" height="32" rx="8" fill="#1E1613"/>
  <rect x="398" y="150" width="76" height="31" rx="8" fill="#1E1613"/>
  <rect x="521" y="148" width="40" height="31" rx="8" fill="#1E1613"/>
  <rect x="31" y="246" width="122" height="32" rx="8" fill="#1E1613"/>
  <rect x="192" y="247" width="144" height="30" rx="8" fill="#1E1613"/>
  <rect x="28" y="331" width="99" height="31" rx="8" fill="#1E1613"/>
  <rect x="159" y="330" width="112" height="32" rx="8" fill="#1E1613"/>
  <rect x="68" y="442" width="44" height="31" rx="8" fill="#1E1613"/>
  <rect x="194" y="441" width="174" height="31" rx="8" fill="#1E1613"/>
  <rect x="405" y="441" width="153" height="31" rx="8" fill="#1E1613"/>
  <rect x="152" y="529" width="93" height="31" rx="8" fill="#1E1613"/>
  <rect x="285" y="529" width="106" height="31" rx="8" fill="#1E1613"/>
  <rect x="432" y="529" width="51" height="31" rx="8" fill="#1E1613"/>
  <!-- the eye -->
  <circle cx="407.5" cy="262.0" r="15.0" fill="#1E1613"/>
  <!-- the bites, in rainbow order: each full circle appears in one frame -->
  <circle cx="130.92" cy="96.05" r="0" fill="#000000"><!-- red bite (upper-left) --><set attributeName="r" to="168.63" begin="0.50s" fill="freeze"/></circle>
  <circle cx="429.88" cy="52.33" r="0" fill="#000000"><!-- orange bite (above-head) --><set attributeName="r" to="168.63" begin="1.00s" fill="freeze"/></circle>
  <circle cx="672.23" cy="65.71" r="0" fill="#000000"><!-- yellow bite (upper-right) --><set attributeName="r" to="168.63" begin="1.20s" fill="freeze"/></circle>
  <circle cx="13.22" cy="370.53" r="0" fill="#000000"><!-- green bite (lower-left) --><set attributeName="r" to="168.63" begin="1.40s" fill="freeze"/></circle>
  <circle cx="197.84" cy="242.72" r="0" fill="#000000"><!-- blue bite (left-of-head) --><set attributeName="r" to="168.63" begin="2.20s" fill="freeze"/></circle>
  <circle cx="668.47" cy="247.97" r="0" fill="#000000"><!-- violet bite (right-of-head) --><set attributeName="r" to="168.63" begin="3.00s" fill="freeze"/></circle>
  <!-- eaten words: blue copies revealed exactly where the bites cover them -->
  <clipPath id="bites">
    <circle cx="130.92" cy="96.05" r="0"><set attributeName="r" to="168.63" begin="0.50s" fill="freeze"/></circle>
    <circle cx="429.88" cy="52.33" r="0"><set attributeName="r" to="168.63" begin="1.00s" fill="freeze"/></circle>
    <circle cx="672.23" cy="65.71" r="0"><set attributeName="r" to="168.63" begin="1.20s" fill="freeze"/></circle>
    <circle cx="13.22" cy="370.53" r="0"><set attributeName="r" to="168.63" begin="1.40s" fill="freeze"/></circle>
    <circle cx="197.84" cy="242.72" r="0"><set attributeName="r" to="168.63" begin="2.20s" fill="freeze"/></circle>
    <circle cx="668.47" cy="247.97" r="0"><set attributeName="r" to="168.63" begin="3.00s" fill="freeze"/></circle>
  </clipPath>
  <g clip-path="url(#bites)">
  <rect x="178" y="54" width="117" height="31" rx="8" fill="#0D385B"/>
  <rect x="334" y="54" width="121" height="31" rx="8" fill="#071E2E"/>
  <rect x="72" y="150" width="187" height="31" rx="8" fill="#071E2E"/>
  <rect x="299" y="149" width="57" height="32" rx="8" fill="#0D385B"/>
  <rect x="398" y="150" width="76" height="31" rx="8" fill="#071E2E"/>
  <rect x="521" y="148" width="40" height="31" rx="8" fill="#0D385B"/>
  <rect x="31" y="246" width="122" height="32" rx="8" fill="#0D385B"/>
  <rect x="192" y="247" width="144" height="30" rx="8" fill="#071E2E"/>
  <rect x="28" y="331" width="99" height="31" rx="8" fill="#071E2E"/>
  <rect x="159" y="330" width="112" height="32" rx="8" fill="#0D385B"/>
  <rect x="68" y="442" width="44" height="31" rx="8" fill="#071E2E"/>
  </g>
</svg>
