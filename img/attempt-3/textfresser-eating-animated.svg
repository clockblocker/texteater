<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <title>textfresser eating a page (animated)</title>
  <desc>Construction: a white page holds black rounded word bars and a small black eye. Six black circles bite the page away around the textfresser, leaving it as the white silhouette (round, circular-arc contours, two pointed ears, a small head, a body flaring out to the bottom) aligned with the reference mascot. The bites land in rainbow order (red, orange, yellow, green, blue, violet). Where a bite covers a word, a blue rectangle is layered directly on top of its black original: the eaten words turn blue, floating on the black that replaced the page. Darker blue words are not yet known, lighter blue ones are processed. This version replays the construction: the six bites grow in rainbow order and the eaten words turn blue exactly where they are covered.</desc>
  <!-- the canvas -->
  <rect width="640" height="640" fill="#000000"/>
  <!-- the page -->
  <rect width="640" height="640" fill="#FFFFFF"/>
  <!-- the words, uneaten -->
  <rect x="178" y="54" width="117" height="31" rx="8" fill="#1E1613"/>
  <rect x="334" y="54" width="121" height="31" rx="8" fill="#1E1613"/>
  <rect x="72" y="150" width="187" height="31" rx="8" fill="#1E1613"/>
  <rect x="299" y="149" width="57" height="32" rx="8" fill="#1E1613"/>
  <rect x="398" y="150" width="76" height="31" rx="8" fill="#1E1613"/>
  <rect x="521" y="148" width="40" height="31" rx="8" fill="#1E1613"/>
  <rect x="31" y="246" width="122" height="32" rx="8" fill="#1E1613"/>
  <rect x="192" y="247" width="144" height="30" rx="8" fill="#1E1613"/>
  <rect x="28" y="331" width="99" height="31" rx="8" fill="#1E1613"/>
  <rect x="159" y="330" width="112" height="32" rx="8" fill="#1E1613"/>
  <rect x="68" y="442" width="44" height="31" rx="8" fill="#1E1613"/>
  <rect x="194" y="441" width="174" height="31" rx="8" fill="#1E1613"/>
  <rect x="405" y="441" width="153" height="31" rx="8" fill="#1E1613"/>
  <rect x="152" y="529" width="93" height="31" rx="8" fill="#1E1613"/>
  <rect x="285" y="529" width="106" height="31" rx="8" fill="#1E1613"/>
  <rect x="432" y="529" width="51" height="31" rx="8" fill="#1E1613"/>
  <!-- the eye -->
  <circle cx="407.5" cy="262.0" r="15.0" fill="#1E1613"/>
  <!-- the bites, in rainbow order: they grow in and eat the page away -->
  <circle cx="427.4" cy="-150.8" r="0" fill="#000000"><!-- red bite (top) --><animate attributeName="r" values="0;370.5" begin="0.40s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="191.1" cy="236.3" r="0" fill="#000000"><!-- orange bite (center-left) --><animate attributeName="r" values="0;177.3" begin="0.95s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="61.9" cy="85.6" r="0" fill="#000000"><!-- yellow bite (top-left) --><animate attributeName="r" values="0;332.0" begin="1.50s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="-118.4" cy="267.6" r="0" fill="#000000"><!-- green bite (left-mid) --><animate attributeName="r" values="0;301.8" begin="2.05s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="-40.6" cy="306.7" r="0" fill="#000000"><!-- blue bite (bottom-left) --><animate attributeName="r" values="0;249.3" begin="2.60s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="746.2" cy="192.4" r="0" fill="#000000"><!-- violet bite (right) --><animate attributeName="r" values="0;260.0" begin="3.15s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <!-- eaten words: blue copies revealed exactly where the bites cover them -->
  <clipPath id="bites">
    <circle cx="427.4" cy="-150.8" r="0"><animate attributeName="r" values="0;370.5" begin="0.40s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="191.1" cy="236.3" r="0"><animate attributeName="r" values="0;177.3" begin="0.95s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="61.9" cy="85.6" r="0"><animate attributeName="r" values="0;332.0" begin="1.50s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="-118.4" cy="267.6" r="0"><animate attributeName="r" values="0;301.8" begin="2.05s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="-40.6" cy="306.7" r="0"><animate attributeName="r" values="0;249.3" begin="2.60s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="746.2" cy="192.4" r="0"><animate attributeName="r" values="0;260.0" begin="3.15s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  </clipPath>
  <g clip-path="url(#bites)">
  <rect x="178" y="54" width="117" height="31" rx="8" fill="#0D385B"/>
  <rect x="334" y="54" width="121" height="31" rx="8" fill="#071E2E"/>
  <rect x="72" y="150" width="187" height="31" rx="8" fill="#071E2E"/>
  <rect x="299" y="149" width="57" height="32" rx="8" fill="#0D385B"/>
  <rect x="398" y="150" width="76" height="31" rx="8" fill="#071E2E"/>
  <rect x="521" y="148" width="40" height="31" rx="8" fill="#0D385B"/>
  <rect x="31" y="246" width="122" height="32" rx="8" fill="#0D385B"/>
  <rect x="192" y="247" width="144" height="30" rx="8" fill="#071E2E"/>
  <rect x="28" y="331" width="99" height="31" rx="8" fill="#071E2E"/>
  <rect x="159" y="330" width="112" height="32" rx="8" fill="#0D385B"/>
  <rect x="68" y="442" width="44" height="31" rx="8" fill="#071E2E"/>
  </g>
</svg>
