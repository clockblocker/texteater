<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <title>textfresser eating a page</title>
  <desc>Construction: a white page holds black rounded word bars and a small black eye. Six black circles bite the page away around the textfresser, leaving it as the white silhouette (round, circular-arc contours, two pointed ears, a small head, a body flaring out to the bottom) aligned with the reference mascot. The bites land in rainbow order (red, orange, yellow, green, blue, violet). Where a bite covers a word, a blue rectangle is layered directly on top of its black original: the eaten words turn blue, floating on the black that replaced the page. Darker blue words are not yet known, lighter blue ones are processed.</desc>
  <!-- the canvas -->
  <rect width="640" height="640" fill="#000000"/>
  <!-- the page -->
  <rect width="640" height="640" fill="#FFFFFF"/>
  <!-- the words, uneaten -->
  <rect x="178" y="54" width="117" height="31" rx="8" fill="#1E1613"/>
  <rect x="334" y="54" width="121" height="31" rx="8" fill="#1E1613"/>
  <rect x="72" y="150" width="187" height="31" rx="8" fill="#1E1613"/>
  <rect x="299" y="149" width="57" height="32" rx="8" fill="#1E1613"/>
  <rect x="398" y="150" width="76" height="31" rx="8" fill="#1E1613"/>
  <rect x="521" y="148" width="40" height="31" rx="8" fill="#1E1613"/>
  <rect x="31" y="246" width="122" height="32" rx="8" fill="#1E1613"/>
  <rect x="192" y="247" width="144" height="30" rx="8" fill="#1E1613"/>
  <rect x="28" y="331" width="99" height="31" rx="8" fill="#1E1613"/>
  <rect x="159" y="330" width="112" height="32" rx="8" fill="#1E1613"/>
  <rect x="68" y="442" width="44" height="31" rx="8" fill="#1E1613"/>
  <rect x="194" y="441" width="174" height="31" rx="8" fill="#1E1613"/>
  <rect x="405" y="441" width="153" height="31" rx="8" fill="#1E1613"/>
  <rect x="152" y="529" width="93" height="31" rx="8" fill="#1E1613"/>
  <rect x="285" y="529" width="106" height="31" rx="8" fill="#1E1613"/>
  <rect x="432" y="529" width="51" height="31" rx="8" fill="#1E1613"/>
  <!-- the eye -->
  <circle cx="407.5" cy="262.0" r="15.0" fill="#1E1613"/>
  <!-- the six bites eat the page away, leaving the textfresser (rainbow order) -->
  <circle cx="427.4" cy="-150.8" r="370.5" fill="#000000"/><!-- top bite, red -->
  <circle cx="191.1" cy="236.3" r="177.3" fill="#000000"/><!-- center-left bite, orange -->
  <circle cx="61.9" cy="85.6" r="332.0" fill="#000000"/><!-- top-left bite, yellow -->
  <circle cx="-118.4" cy="267.6" r="301.8" fill="#000000"/><!-- left-mid bite, green -->
  <circle cx="-40.6" cy="306.7" r="249.3" fill="#000000"/><!-- bottom-left bite, blue -->
  <circle cx="746.2" cy="192.4" r="260.0" fill="#000000"/><!-- right bite, violet -->
  <!-- eaten words: blue copies on top of their black originals, only where the bites cover them -->
  <clipPath id="bites">
    <circle cx="427.4" cy="-150.8" r="370.5"/>
    <circle cx="191.1" cy="236.3" r="177.3"/>
    <circle cx="61.9" cy="85.6" r="332.0"/>
    <circle cx="-118.4" cy="267.6" r="301.8"/>
    <circle cx="-40.6" cy="306.7" r="249.3"/>
    <circle cx="746.2" cy="192.4" r="260.0"/>
  </clipPath>
  <g clip-path="url(#bites)">
  <rect x="178" y="54" width="117" height="31" rx="8" fill="#0D385B"/>
  <rect x="334" y="54" width="121" height="31" rx="8" fill="#071E2E"/>
  <rect x="72" y="150" width="187" height="31" rx="8" fill="#071E2E"/>
  <rect x="299" y="149" width="57" height="32" rx="8" fill="#0D385B"/>
  <rect x="398" y="150" width="76" height="31" rx="8" fill="#071E2E"/>
  <rect x="521" y="148" width="40" height="31" rx="8" fill="#0D385B"/>
  <rect x="31" y="246" width="122" height="32" rx="8" fill="#0D385B"/>
  <rect x="192" y="247" width="144" height="30" rx="8" fill="#071E2E"/>
  <rect x="28" y="331" width="99" height="31" rx="8" fill="#071E2E"/>
  <rect x="159" y="330" width="112" height="32" rx="8" fill="#0D385B"/>
  <rect x="68" y="442" width="44" height="31" rx="8" fill="#071E2E"/>
  </g>
</svg>
