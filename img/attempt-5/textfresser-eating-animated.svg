<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <title>textfresser eating a page (animated)</title>
  <desc>Construction: a white page holds black rounded word bars and a small black eye. Six equal black circles bite the page away around the textfresser, leaving it as the white silhouette (round head with a domed top, body flaring out to the bottom-left) aligned with the reference mascot. The bites land in rainbow order (red, orange, yellow, green, blue, violet): red takes the top-left corner, orange the upper right, yellow drops straight onto the head from above, green the head's left slope, blue the far left, and violet the lower-left sweep that completes the silhouette. Where a bite covers a word, a blue rectangle is layered directly on top of its black original: the eaten words turn blue, floating on the black that replaced the page. Darker blue words are not yet known, lighter blue ones are processed. This version replays the construction: the six equal bites grow in rainbow order and the eaten words turn blue exactly where they are covered.</desc>
  <!-- the canvas -->
  <rect width="640" height="640" fill="#000000"/>
  <!-- the page -->
  <rect width="640" height="640" fill="#FFFFFF"/>
  <!-- the words, uneaten -->
  <rect x="178" y="54" width="117" height="31" rx="8" fill="#1E1613"/>
  <rect x="334" y="54" width="121" height="31" rx="8" fill="#1E1613"/>
  <rect x="72" y="150" width="187" height="31" rx="8" fill="#1E1613"/>
  <rect x="299" y="149" width="57" height="32" rx="8" fill="#1E1613"/>
  <rect x="398" y="150" width="76" height="31" rx="8" fill="#1E1613"/>
  <rect x="521" y="148" width="40" height="31" rx="8" fill="#1E1613"/>
  <rect x="31" y="246" width="122" height="32" rx="8" fill="#1E1613"/>
  <rect x="192" y="247" width="144" height="30" rx="8" fill="#1E1613"/>
  <rect x="28" y="331" width="99" height="31" rx="8" fill="#1E1613"/>
  <rect x="159" y="330" width="112" height="32" rx="8" fill="#1E1613"/>
  <rect x="68" y="442" width="44" height="31" rx="8" fill="#1E1613"/>
  <rect x="194" y="441" width="174" height="31" rx="8" fill="#1E1613"/>
  <rect x="405" y="441" width="153" height="31" rx="8" fill="#1E1613"/>
  <rect x="152" y="529" width="93" height="31" rx="8" fill="#1E1613"/>
  <rect x="285" y="529" width="106" height="31" rx="8" fill="#1E1613"/>
  <rect x="432" y="529" width="51" height="31" rx="8" fill="#1E1613"/>
  <!-- the eye -->
  <circle cx="407.5" cy="262.0" r="15.0" fill="#1E1613"/>
  <!-- the bites, in rainbow order: they grow in and eat the page away -->
  <circle cx="147.06" cy="92.60" r="0" fill="#000000"><!-- red bite (upper-left) --><animate attributeName="r" values="0;171.00" begin="0.40s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="671.04" cy="248.05" r="0" fill="#000000"><!-- orange bite (upper-right) --><animate attributeName="r" values="0;171.00" begin="0.95s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="469.37" cy="55.43" r="0" fill="#000000"><!-- yellow bite (above-head) --><animate attributeName="r" values="0;171.00" begin="1.50s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="195.75" cy="241.30" r="0" fill="#000000"><!-- green bite (left-of-head) --><animate attributeName="r" values="0;171.00" begin="2.05s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="-85.00" cy="405.00" r="0" fill="#000000"><!-- blue bite (far-left) --><animate attributeName="r" values="0;171.00" begin="2.60s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <circle cx="11.36" cy="369.02" r="0" fill="#000000"><!-- violet bite (left-middle) --><animate attributeName="r" values="0;171.00" begin="3.15s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  <!-- eaten words: blue copies revealed exactly where the bites cover them -->
  <clipPath id="bites">
    <circle cx="147.06" cy="92.60" r="0"><animate attributeName="r" values="0;171.00" begin="0.40s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="671.04" cy="248.05" r="0"><animate attributeName="r" values="0;171.00" begin="0.95s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="469.37" cy="55.43" r="0"><animate attributeName="r" values="0;171.00" begin="1.50s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="195.75" cy="241.30" r="0"><animate attributeName="r" values="0;171.00" begin="2.05s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="-85.00" cy="405.00" r="0"><animate attributeName="r" values="0;171.00" begin="2.60s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
    <circle cx="11.36" cy="369.02" r="0"><animate attributeName="r" values="0;171.00" begin="3.15s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></circle>
  </clipPath>
  <g clip-path="url(#bites)">
  <rect x="178" y="54" width="117" height="31" rx="8" fill="#0D385B"/>
  <rect x="334" y="54" width="121" height="31" rx="8" fill="#071E2E"/>
  <rect x="72" y="150" width="187" height="31" rx="8" fill="#071E2E"/>
  <rect x="299" y="149" width="57" height="32" rx="8" fill="#0D385B"/>
  <rect x="398" y="150" width="76" height="31" rx="8" fill="#071E2E"/>
  <rect x="521" y="148" width="40" height="31" rx="8" fill="#0D385B"/>
  <rect x="31" y="246" width="122" height="32" rx="8" fill="#0D385B"/>
  <rect x="192" y="247" width="144" height="30" rx="8" fill="#071E2E"/>
  <rect x="28" y="331" width="99" height="31" rx="8" fill="#071E2E"/>
  <rect x="159" y="330" width="112" height="32" rx="8" fill="#0D385B"/>
  <rect x="68" y="442" width="44" height="31" rx="8" fill="#071E2E"/>
  </g>
</svg>
